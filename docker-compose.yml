version: '3.8'

services:
  mdu:
    build: .
    container_name: mdu-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///./data/bookings.db
      - LOG_LEVEL=INFO
    env_file:
      - .env
    restart: unless-stopped