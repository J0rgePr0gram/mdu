version: '3.8'

services:
  mdu:
    build: .
    container_name: mdu-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:rw
      - ./mdu.log:/app/mdu.log
    environment:
      - DATABASE_URL=sqlite:///./data/bookings.db
      - LOG_LEVEL=INFO
    env_file:
      - .env
    restart: unless-stopped